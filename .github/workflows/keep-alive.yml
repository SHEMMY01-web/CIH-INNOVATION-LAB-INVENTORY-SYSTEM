name: Keep Supabase Database Active

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://kkltrgjszsuozlrnjrnb.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_XhJwMl5PFjt7uEoKqlMwxw_pXJ0vcur' }}
        run: |
          echo "Pinging Supabase database at $SUPABASE_URL..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1")
          
          echo "Supabase HTTP response: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "✅ Success! Supabase database responded with HTTP 200. Project is warm and active."
          else
            echo "❌ Error: Received HTTP $STATUS_CODE from Supabase."
            exit 1
          fi
