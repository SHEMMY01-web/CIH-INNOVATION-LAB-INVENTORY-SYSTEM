<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/FRONTEND/CSS/global.css" />
    <link rel="stylesheet" href="/FRONTEND/CSS/table_layout.css" />
    <title>GRN Report</title>
  </head>
  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="/FRONTEND/IMAGES/cih-removebg-preview.png" alt="Logo" class="sidebar-logo">
          <h2>Inventory</h2>
        </div>
        
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item">
            <span class="nav-icon">⊞</span> Dashboard
          </a>
          <a href="items.html" class="nav-item">
            <span class="nav-icon">👜</span> Items
          </a>
          <a href="tools.html" class="nav-item">
            <span class="nav-icon">🔧</span> Tools
          </a>
          <a href="assets.html" class="nav-item">
            <span class="nav-icon">📊</span> Assets
          </a>
          <a href="project.html" class="nav-item">
            <span class="nav-icon">📁</span> Project
          </a>
          <a href="request.html" class="nav-item">
            <span class="nav-icon">➕</span> Requested & Returned
          </a>
          <a href="on_hand.html" class="nav-item">
            <span class="nav-icon">📦</span> On hand
          </a>
          <a href="grn_report.html" class="nav-item active">
            <span class="nav-icon">📄</span> GRN Report
          </a>
        </nav>

        <div class="theme-toggle">
          <button class="toggle-btn active">☀️ Light</button>
          <button class="toggle-btn">🌙 Dark</button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Top Navbar -->
        <header class="topbar">
          <div class="topbar-left">
            <h1>GRN Report</h1>
          </div>
          
          <div class="topbar-right">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search">
            </div>
            
            <button class="notification-btn">
              <span class="bell-icon">🔔</span>
            </button>
            
            <div class="user-profile">
              <div class="avatar"></div>
              <div class="user-info">
                <strong>Mathias W.</strong>
                <span>Store Manager</span>
              </div>
              <span class="dropdown-icon">▼</span>
            </div>
          </div>
        </header>

        <!-- Main Card Container -->
        <div class="table-container">
          <div class="table-toolbar">
            <div class="table-search">
              <span class="search-icon">🔍</span>
              <input type="text" placeholder="Search Item">
            </div>
            <div class="toolbar-actions">
              <button class="action-btn primary">
                <span>⬇</span> Export
              </button>
              <button class="action-btn primary">
                <span>⧼⧽</span> Filter
              </button>
            </div>
          </div>

          <!-- Empty State Area -->
          <div class="empty-state">
            <img src="/FRONTEND/IMAGES/empty-state.png" alt="Empty State Illustration" class="empty-state-img">
            <h3>Nothing found.</h3>
          </div>

          <!-- Pagination -->
          <div class="pagination-bar">
            <div class="showing-entries">
              Showing 
              <select>
                <option>6</option>
                <option>10</option>
                <option>20</option>
              </select>
            </div>
            
            <div class="total-records">
              Showing 1 to 6 out of 12 projects
            </div>

            <div class="pagination-controls">
              <button class="page-btn">❮</button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn">❯</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
