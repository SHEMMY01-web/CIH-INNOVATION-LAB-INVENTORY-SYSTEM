<!doctype html>
<html lang="en">
  <head>  <script>
    (function() {
      var t = localStorage.getItem('app-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/FRONTEND/CSS/global.css" />
    <link rel="stylesheet" href="/FRONTEND/CSS/forgot.css" />
    <title>Forgot Password — CIH Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
  <body>
    <section class="auth-section">
      <div class="auth-container">
        <div class="auth-header">
          <h1>Forgot Password</h1>
          <p>
            Enter your registered email address. We'll send you a link to reset
            your password.
          </p>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <input type="email" id="forgot-email" required placeholder="Email" />
          </div>
          <p id="forgot-message" style="font-size:0.9rem; min-height:18px; margin: 0 0 8px 0;"></p>
          <input type="submit" id="forgot-btn" class="btn-primary" value="Send Reset Link" />
        </form>
        <div class="back-link">
          <a href="index.html">&larr; Back to Login</a>
        </div>
      </div>
    </section>
  
    <!-- Supabase Client & App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/FRONTEND/JS/env.js"></script>
    <script src="/FRONTEND/JS/auth.js"></script>
    <script src="/FRONTEND/JS/app.js"></script>
    <script>
      const forgotForm = document.getElementById('forgot-form');
      const forgotMessage = document.getElementById('forgot-message');
      const forgotBtn = document.getElementById('forgot-btn');

      forgotForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();

        forgotBtn.value = 'Sending...';
        forgotBtn.disabled = true;
        forgotMessage.textContent = '';

        // Determine the correct redirect URL for password reset
        const origin = window.location.origin;
        const redirectTo = `${origin}/login_successful`;

        const { error } = await sbClient.auth.resetPasswordForEmail(email, {
          redirectTo: redirectTo
        });

        if (error) {
          forgotMessage.style.color = '#e53935';
          forgotMessage.textContent = error.message;
          forgotBtn.value = 'Send Reset Link';
          forgotBtn.disabled = false;
        } else {
          forgotMessage.style.color = '#2e7d32';
          forgotMessage.textContent = 'Password reset link sent! Check your email.';
          forgotBtn.value = 'Link Sent ✓';
          // Don't re-enable button — prevent spam
        }
      });
    </script>
  </body>
</html>
