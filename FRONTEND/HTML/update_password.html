<!doctype html>
<html lang="en">
  <head>  <script>
    (function() {
      var t = localStorage.getItem('app-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FRONTEND/IMAGES/cih-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/FRONTEND/CSS/global.css" />
    <link rel="stylesheet" href="/FRONTEND/CSS/forgot.css" />
    <title>Update Password — CIH Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
  <body>
    <section class="auth-section">
      <div class="auth-container">
        <div class="auth-header">
          <h1>Update Password</h1>
          <p>
            Please enter your new password below.
          </p>
        </div>

        <form id="update-form">
          <div class="form-group" style="position: relative;">
            <input type="password" id="update-password" required placeholder="New Password" style="width: 100%; padding-right: 40px; box-sizing: border-box;" />
            <span class="material-symbols-outlined toggle-password" id="toggle-pwd-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; user-select: none;">visibility_off</span>
          </div>
          <p id="update-message" style="font-size:0.9rem; min-height:18px; margin: 0 0 8px 0;"></p>
          <input type="submit" id="update-btn" class="btn-primary" value="Set New Password" />
        </form>
        <div class="back-link">
          <a href="index.html">&larr; Back to Login</a>
        </div>
      </div>
    </section>
  
    <!-- Supabase Client & App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/FRONTEND/JS/env.js"></script>
    <script src="/FRONTEND/JS/auth.js"></script>
    <script src="/FRONTEND/JS/app.js"></script>
    <script>
      // Password visibility toggle
      const togglePwdBtn = document.getElementById('toggle-pwd-btn');
      const pwdInput = document.getElementById('update-password');
      togglePwdBtn.addEventListener('click', () => {
        const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwdInput.setAttribute('type', type);
        togglePwdBtn.textContent = type === 'password' ? 'visibility_off' : 'visibility';
      });

      const updateForm = document.getElementById('update-form');
      const updateMessage = document.getElementById('update-message');
      const updateBtn = document.getElementById('update-btn');

      updateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = pwdInput.value;

        updateBtn.value = 'Updating...';
        updateBtn.disabled = true;
        updateMessage.textContent = '';

        const { error } = await sbClient.auth.updateUser({ password: password });

        if (error) {
          updateMessage.style.color = '#e53935';
          updateMessage.textContent = error.message;
          updateBtn.value = 'Set New Password';
          updateBtn.disabled = false;
        } else {
          updateMessage.style.color = '#2e7d32';
          updateMessage.textContent = 'Password updated securely!';
          updateBtn.value = 'Success ✓';
          
          // CRITICAL SECURITY FIX: immediately sign out to prevent auto-login
          await sbClient.auth.signOut();

          // Redirect to success page, which prompts manual login
          window.location.replace('/login_successful');
        }
      });
    </script>
  </body>
</html>
