<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply saved theme before render to prevent flash
      (function() {
        var t = localStorage.getItem('app-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/FRONTEND/IMAGES/cih.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIH Innovation Lab - Full Catalog</title>
    <meta name="description" content="Browse the complete inventory of tools, assets, and equipment available at the CIH Innovation Lab." />
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="/FRONTEND/CSS/global.css" />
    <link rel="stylesheet" href="/FRONTEND/CSS/landing.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="landing-nav">
      <div class="nav-container">
        <div class="logo-area">
          <a href="/FRONTEND/HTML/index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;">
            <img src="/FRONTEND/IMAGES/cih-removebg-preview.png" alt="CIH Logo" class="landing-logo" />
            <span class="logo-text">Innovation Lab Inventory</span>
          </a>
        </div>
        <div class="nav-links">
          <a href="/FRONTEND/HTML/index.html#about">About Us</a>
          <a href="/FRONTEND/HTML/index.html#projects">Projects</a>
          <a href="#items">Items</a>
          <a href="/FRONTEND/HTML/index.html#comments">Comments</a>
        </div>
        <div class="nav-actions">
          <button class="theme-btn" id="landing-theme-toggle">
            <span class="material-symbols-outlined light-icon">light_mode</span>
            <span class="material-symbols-outlined dark-icon" style="display:none;">dark_mode</span>
          </button>
          <a href="/login.html" class="login-btn-nav">
            <span class="material-symbols-outlined">login</span> Staff Login
          </a>
        </div>
      </div>
    </nav>

    <!-- Full Catalog Section -->
    <section id="items" class="catalog-section" style="padding-top: 120px;">
      <div class="section-container">
        <div class="catalog-top-bar">
          <div class="catalog-header">
            <h2 class="section-title">Full <span>Catalog</span></h2>
            <div class="catalog-stats" id="catalog-stats">Loading...</div>
          </div>
          
          <div class="catalog-controls">
            <div class="search-container">
              <span class="material-symbols-outlined search-icon">search</span>
              <input type="text" id="catalog-search" placeholder="Search by item name, model, or type..." />
            </div>

            <div class="filter-chips">
              <button class="chip active" data-filter="all">All Items</button>
              <button class="chip" data-filter="assets">Assets</button>
              <button class="chip" data-filter="tools">Tools</button>
              <button class="chip" data-filter="general">General</button>
            </div>
          </div>
        </div>

        <!-- Loading Skeleton -->
        <div id="catalog-loading" class="catalog-grid skeleton-grid">
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
          <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line short"></div><div class="skeleton-line"></div><div class="skeleton-line medium"></div><div class="skeleton-footer"><div class="skeleton-badge"></div><div class="skeleton-qty"></div></div></div></div>
        </div>

        <!-- Items Grid -->
        <div class="catalog-grid" id="catalog-grid" style="display: none;">
          <!-- Cards will be injected here dynamically -->
        </div>
      
        <!-- Empty State -->
        <div class="empty-state" id="catalog-empty" style="display: none;">
          <span class="material-symbols-outlined">inventory_2</span>
          <h3>No items found</h3>
          <p>Try adjusting your search or filters.</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="landing-footer">
      <p>&copy; 2026 CIH Innovation Lab. All rights reserved.</p>
    </footer>

    <!-- Supabase Client & App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/FRONTEND/JS/env.js"></script>
    <script src="/FRONTEND/JS/auth.js"></script>
    <script src="/FRONTEND/JS/landing.js"></script>
  </body>
</html>
